name: Release

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: FreeClimb

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: "recursive"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.6"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ runner.os }}-xmake-release-cache-

      - name: Setup environment
        uses: ./.github/actions/setup-deps
        with:
          platform: windows
          build_profile: release

      # CommonLibSSE-NG uses its prebuilt lib (built with VR) when GITHUB_ACTIONS is set,
      # which conflicts with FreeClimb's SE/AE-only config. Build it from source instead.
      - name: Build
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake build -y ${{ env.PLUGIN_NAME }}
      - name: Install
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake install -o ./build/artifact ${{ env.PLUGIN_NAME }}

      - name: Package artifact
        shell: pwsh
        run: |
          $name = "${{ env.PLUGIN_NAME }}"
          Compress-Archive -Path ./build/artifact/* -DestinationPath "$name-windows.zip"

      - name: Create GitHub Release (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create `
            "${{ github.ref_name }}" `
            "${{ env.PLUGIN_NAME }}-windows.zip" `
            --title "${{ env.PLUGIN_NAME }} ${{ github.ref_name }}" `
            --generate-notes
