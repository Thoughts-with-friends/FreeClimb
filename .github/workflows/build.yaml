name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.6"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ runner.os }}-xmake-build-cache-

      - name: Extract plugin info from xmake.lua
        id: plugin
        shell: pwsh
        run: |
          $content = Get-Content xmake.lua -Raw
          $pattern = 'local\s+PLUGIN_NAME<[^>]*>\s*=\s*"([^"]+)"'

          if ($content -match $pattern) {
            "PLUGIN_NAME=$($matches[1])" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "PLUGIN_NAME not found in xmake.lua"
            exit 1
          }

      # CommonLibSSE-NG uses its prebuilt lib (built with VR) when GITHUB_ACTIONS is set,
      # which conflicts with FreeClimb's SE/AE-only config. Build it from source instead.
      - name: Build
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake build -y ${{ steps.plugin.outputs.PLUGIN_NAME }}
      - name: Install
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake install -o ./build/artifact ${{ steps.plugin.outputs.PLUGIN_NAME }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plugin.outputs.PLUGIN_NAME }}
          path: |
            ./build/artifact/**
