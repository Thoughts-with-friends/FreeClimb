name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

env:
  PLUGIN_NAME: FreeClimb

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.6"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: ${{ runner.os }}-xmake-build-cache-

      # CommonLibSSE-NG uses its prebuilt lib (built with VR) when GITHUB_ACTIONS is set,
      # which conflicts with FreeClimb's SE/AE-only config. Build it from source instead.
      - name: Build
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake build -y ${{ env.PLUGIN_NAME }}
      - name: Install
        run: |
          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          xmake install -o ./build/artifact ${{ env.PLUGIN_NAME }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: |
            ./build/artifact/**
